<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Series Tinder</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
    <button id="btn-share" class="btn-share">🔗 Отправить приглашение партнеру</button>

    <div id="card" class="card">
        <img id="series-image" src="" alt="Постер сериала">
        <div class="card-info">
            <h2 id="series-title">Загрузка...</h2>
        </div>
    </div>

    <div class="controls" id="controls">
        <button id="btn-dislike" class="btn btn-dislike">❌</button>
        <button id="btn-like" class="btn btn-like">❤️</button>
    </div>

    <div id="empty-state" class="hidden">
        <h2>Новых сериалов пока нет 😢</h2>
        <p>Вы просмотрели всё, что было в базе.</p>
    </div>
</div>
<script src="app.js"></script>
</body>
</html>
